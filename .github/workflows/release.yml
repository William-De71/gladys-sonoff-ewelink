# -----------------------------------------------------------------------------
# Automatic release: every merge on main publishes a version when the commits
# deserve one, without any action from the maintainer.
#
#   push on main ──> CI (ci.yml) ──> next version from the Conventional Commits
#     ──> CHANGELOG.md section ──> commit "chore(release): X.Y.Z" + tag vX.Y.Z
#     ──> image :X.Y.Z + :latest (build.yml) ──> GitHub Release (github-release.yml)
#     ──> verification (anonymous pull, amd64 + arm64, store validator, topic)
#
# Versions: feat -> minor, fix/perf -> patch, breaking -> major (a minor below
# 1.0.0: the project never goes 1.0.0 on its own). docs/chore/ci/test/style/
# refactor/build alone release nothing. No tag yet: the current version (0.1.0)
# is released as is.
#
# Manual run (Actions -> Release -> Run workflow):
#   - release-as: force a version, e.g. 1.0.0 (the maintainer's decision);
#   - dry-run: show the version and the changelog section in the job summary,
#     publish nothing.
#
# Why build.yml and github-release.yml are called instead of triggered by the
# tag: a tag pushed with the default GITHUB_TOKEN triggers no other workflow.
# For the same reason, the release commit pushed here does not start this
# workflow again (and the `if` below skips it if it ever did).
#
# Protected main branch: the push of the release commit is refused unless
# GitHub Actions may bypass the rule (see the README, "Release process").
# -----------------------------------------------------------------------------
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-as:
        description: 'Force this version (e.g. 1.0.0); empty = computed from the commits'
        required: false
        default: ''
        type: string
      dry-run:
        description: 'Compute and show the version and the changelog, publish nothing'
        required: false
        default: false
        type: boolean

# One release at a time, never cancelled half-way (a pushed tag without its
# image would be worse than a queued release).
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the release and push the tag
    outputs:
      release: ${{ steps.next.outputs.release }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit and tag, for the version and the changelog

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true

      - name: Compute the next version
        id: next
        env:
          RELEASE_AS: ${{ inputs.release-as }}
        run: |
          set -euo pipefail
          next="$(node .github/scripts/release.mjs next "${RELEASE_AS:-}")"
          echo "Next: $next"
          release="$(jq -r .release <<<"$next")"
          version="$(jq -r .version <<<"$next")"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$release" != "true" ]; then
            echo "No releasable commit since the last tag (docs, chore, ci, test, style, refactor or build only)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update the version files and the changelog
        if: steps.next.outputs.release == 'true'
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          node .github/scripts/release.mjs prepare "$VERSION" "$image"
          node .github/scripts/release.mjs changelog "$VERSION" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          npx --yes prettier@3 --check CHANGELOG.md package.json gladys-assistant-integration.json
          {
            echo "## Release ${VERSION}"
            echo ""
            node .github/scripts/release.mjs notes "$VERSION" < CHANGELOG.md
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run, nothing published
        if: steps.next.outputs.release == 'true' && inputs.dry-run
        run: |
          echo "> Dry run: no commit, no tag, no image, no GitHub Release." >> "$GITHUB_STEP_SUMMARY"
          git diff --stat

      - name: Commit, tag and push
        if: steps.next.outputs.release == 'true' && !inputs.dry-run
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json gladys-assistant-integration.json CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          # One atomic push: the branch and the tag land together or not at
          # all (two pushes can leave main bumped without its tag).
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/v${VERSION}"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true' && !inputs.dry-run
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.prepare.outputs.version }}

  github-release:
    needs: build
    uses: ./.github/workflows/github-release.yml
    permissions:
      contents: write

  verify:
    needs: [prepare, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the release
        uses: actions/checkout@v7
        with:
          ref: v${{ needs.prepare.outputs.version }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true

      - name: The image is public and multi-architecture
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          # An anonymous pull token, exactly what a Gladys instance gets.
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty')" || true
          index="$(curl -fsS -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${VERSION}")" || {
            echo "::error::ghcr.io/${repo}:${VERSION} cannot be pulled without authentication. Make the package public: Package settings -> Change visibility -> Public."
            exit 1
          }
          platforms="$(jq -r '[.manifests[]?.platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | join(" ")' <<<"$index")"
          echo "Platforms: $platforms"
          for platform in linux/amd64 linux/arm64; do
            if ! grep -qw "$platform" <<<"$platforms"; then
              echo "::error::The image has no ${platform} variant (found: ${platforms})."
              exit 1
            fi
          done
          echo "Image ghcr.io/${repo}:${VERSION} is public: ${platforms}" >> "$GITHUB_STEP_SUMMARY"

      - name: Store admission checks (image included)
        run: npx --yes github:GladysAssistant/integration-store .

      - name: Store topic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          topics="$(gh api "repos/${GITHUB_REPOSITORY}/topics" --jq '.names[]' || true)"
          if ! grep -qx 'gladys-assistant-integration' <<<"$topics"; then
            echo "::warning::Add the 'gladys-assistant-integration' topic to the repository (About -> Topics): the store only indexes tagged repositories, and GITHUB_TOKEN cannot set it."
          fi
