<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Automatic release pipeline</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#4a5a66"/>
    </marker>
  </defs>
  <rect width="1000" height="230" fill="#ffffff"/>
  <g font-size="13" text-anchor="middle">
    <rect x="10" y="60" width="108" height="70" rx="10" fill="#e8f1fb" stroke="#2f6fb5"/>
    <text x="64" y="90" font-weight="700" fill="#1d4f86">Merge</text>
    <text x="64" y="110" fill="#33424d">feat / fix / perf</text>

    <rect x="134" y="60" width="108" height="70" rx="10" fill="#eef8f1" stroke="#2e8b57"/>
    <text x="188" y="90" font-weight="700" fill="#1f6b41">CI</text>
    <text x="188" y="110" fill="#33424d">lint · tests · build</text>

    <rect x="258" y="60" width="108" height="70" rx="10" fill="#fff8e6" stroke="#c9952b"/>
    <text x="312" y="90" font-weight="700" fill="#8a6414">Version</text>
    <text x="312" y="110" fill="#33424d">from commits</text>

    <rect x="382" y="60" width="108" height="70" rx="10" fill="#fff8e6" stroke="#c9952b"/>
    <text x="436" y="90" font-weight="700" fill="#8a6414">Changelog</text>
    <text x="436" y="110" fill="#33424d">generated</text>

    <rect x="506" y="60" width="108" height="70" rx="10" fill="#fff8e6" stroke="#c9952b"/>
    <text x="560" y="90" font-weight="700" fill="#8a6414">Tag</text>
    <text x="560" y="110" fill="#33424d">vX.Y.Z (atomic)</text>

    <rect x="630" y="60" width="108" height="70" rx="10" fill="#f3eefb" stroke="#7a52b3"/>
    <text x="684" y="90" font-weight="700" fill="#57358a">Image</text>
    <text x="684" y="110" fill="#33424d">amd64 + arm64</text>

    <rect x="754" y="60" width="108" height="70" rx="10" fill="#f3eefb" stroke="#7a52b3"/>
    <text x="808" y="90" font-weight="700" fill="#57358a">GitHub</text>
    <text x="808" y="110" fill="#33424d">Release</text>

    <rect x="878" y="60" width="112" height="70" rx="10" fill="#eef8f1" stroke="#2e8b57"/>
    <text x="934" y="90" font-weight="700" fill="#1f6b41">Verify</text>
    <text x="934" y="110" fill="#33424d">public · store</text>
  </g>
  <g stroke="#4a5a66" stroke-width="2">
    <line x1="118" y1="95" x2="131" y2="95" marker-end="url(#a)"/>
    <line x1="242" y1="95" x2="255" y2="95" marker-end="url(#a)"/>
    <line x1="366" y1="95" x2="379" y2="95" marker-end="url(#a)"/>
    <line x1="490" y1="95" x2="503" y2="95" marker-end="url(#a)"/>
    <line x1="614" y1="95" x2="627" y2="95" marker-end="url(#a)"/>
    <line x1="738" y1="95" x2="751" y2="95" marker-end="url(#a)"/>
    <line x1="862" y1="95" x2="875" y2="95" marker-end="url(#a)"/>
  </g>
  <g font-size="12" fill="#6b7a85" text-anchor="middle">
    <text x="312" y="160">feat → minor · fix/perf → patch</text>
    <text x="312" y="178">breaking → major (minor below 1.0.0)</text>
    <text x="560" y="160">chore(release): X.Y.Z</text>
    <text x="560" y="178">never re-triggers the workflow</text>
    <text x="808" y="160">notes = CHANGELOG section</text>
    <text x="808" y="178">dry-run: summary only</text>
  </g>
  <text x="500" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#33424d">Every merge on main, no manual step</text>
</svg>
